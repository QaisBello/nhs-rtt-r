name: check
on: [push, pull_request]
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with: { dependencies: '"all"' }
      - name: Clean the raw files
        run: Rscript scripts/01_clean.R
      - name: Analyse
        run: Rscript scripts/02_analyse.R
      - name: Tests
        run: Rscript -e 'testthat::test_dir("tests/testthat", stop_on_failure = TRUE)'
      - name: Render the report
        run: Rscript -e 'rmarkdown::render("report/index.Rmd", output_dir = "web")'
